name: Build Miatoll Kernel (Exact 4.14.117)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # TRICK: Run inside a 20.04 container to get the correct compiler instantly
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y bc bison flex libssl-dev libncurses-dev build-essential gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu zip git wget curl python3 sudo

      - name: Nuke Xiaomi Strict Compiler Wrapper
        run: |
          cat << 'EOF' > scripts/gcc-wrapper.py
          import sys
          import os

          if __name__ == '__main__':
              if len(sys.argv) > 1:
                  os.execvp(sys.argv[1], sys.argv[1:])
          EOF
          chmod +x scripts/gcc-wrapper.py

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=github-actions
          
          # 1. Generate configuration
          make O=out ARCH=arm64 vendor/atoll-perf_defconfig
          
          # 2. Disable module signature enforcement
          sed -i 's/CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/g' out/.config
          sed -i 's/CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/g' out/.config
          
          # 3. Disable built-in config warning flags
          sed -i 's/CONFIG_ERROR_ON_WARNING=y/# CONFIG_ERROR_ON_WARNING is not set/g' out/.config
          
          # 4. Compile natively using the container's GCC 9 environment
          make -j$(nproc --all) O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cp out/arch/arm64/boot/Image.gz-dtb AK3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz AK3/
          cd AK3
          zip -r9 ../kernel-flashable.zip . -x ".git/*" -x "README.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashable-kernel
          path: kernel-flashable.zip
