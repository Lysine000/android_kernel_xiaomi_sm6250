name: Build Miatoll Kernel (Clang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          repository: xiaomi-sm6250-devs/android_kernel_xiaomi_sm6250 
          ref: 11.0 

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses-dev build-essential zip git wget curl gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Proton-Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build Kernel
        run: |
          # Inject Clang into the system path
          export PATH="$(pwd)/clang/bin:$PATH"
          
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=builder
          export KBUILD_BUILD_HOST=github-actions
          
          # Set explicit LLVM/Clang compiler arguments
          export MAKE_ARGS="O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip"
            
          # 1. Generate config 
          make $MAKE_ARGS vendor/atoll-perf_defconfig
          
          # 2. Disable module signature enforcement
          sed -i 's/CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/g' out/.config
          sed -i 's/CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/g' out/.config
          
          # 3. Compile at full speed
          make -j$(nproc --all) $MAKE_ARGS

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AK3
          cp out/arch/arm64/boot/Image.gz-dtb AK3/ 2>/dev/null || cp out/arch/arm64/boot/Image.gz AK3/
          cd AK3
          zip -r9 ../kernel-flashable.zip . -x ".git/*" -x "README.md"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashable-kernel
          path: AK3/kernel-flashable.zip
